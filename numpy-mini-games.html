<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NumPy Mini Games | Young IT Germany</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#fff6df 0%,#f7ecc6 28%,#4cbf98 68%,#0b7a5a 100%) fixed;font-family:Arial,Helvetica,sans-serif;font-size:20px;color:#0e3a2c}
.logo{position:fixed;top:10px;left:12px;font-size:14px;font-weight:bold;background:#fff;border-radius:20px;padding:5px 12px;box-shadow:0 2px 6px #0004;z-index:5}
.logo b{color:#0b7a5a}.logo i{color:#d89a00;font-style:normal}.logo u{color:#e4572e;text-decoration:none}
main{max-width:900px;margin:0 auto;padding:62px 14px 40px}
.ban{background:#fff9e8;border:3px solid #0b7a5a;border-radius:18px;padding:10px 18px;margin:10px 0;color:#075c44;box-shadow:0 4px 10px #0003}
h1{font-size:38px;text-align:center;margin:0}h2{font-size:28px;margin:0}
.sub{text-align:center;font-size:21px;margin-top:6px;color:#0b7a5a}
.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 6px 16px #0003;line-height:1.5}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}
.mc{background:#fffbef;border:5px solid #fff;border-radius:22px;padding:14px;text-align:center;cursor:pointer;font-family:inherit;font-size:20px;color:#0e3a2c;box-shadow:0 6px 14px #0003}
.mc:hover{border-color:#f2b705;transform:translateY(-3px)}.mc .e{font-size:50px;display:block}.mc.v{border-color:#0b7a5a}
.mc small{display:block;color:#0b7a5a;font-weight:bold;margin-top:4px}
.b{background:#0b7a5a;color:#fff;border:0;border-radius:14px;padding:12px 20px;font-size:20px;font-family:inherit;cursor:pointer;margin:6px 4px}
.b.o{background:#c8431e}.b.y{background:#f2b705;color:#0e3a2c}.b.w{background:#fff;color:#0b7a5a;border:3px solid #0b7a5a}
input[type=text]{font-size:20px;font-family:inherit;padding:10px;border:3px solid #a9dcc8;border-radius:12px;width:100%;max-width:360px}
.pill{display:inline-block;background:#f2b705;color:#0e3a2c;border-radius:20px;padding:4px 14px;font-weight:bold;font-size:16px}
.say{display:flex;gap:12px;align-items:center;background:#fff6dc;border-left:8px solid #0b7a5a;border-radius:16px;padding:12px;margin:10px 0}.say .c{font-size:54px}
.tips{background:#e8f8f0;border-left:8px solid #f2b705;border-radius:12px;padding:8px 16px;margin-top:14px;font-size:18px}.tips summary{font-weight:bold;cursor:pointer;font-size:20px}
code{background:#0f2e24;color:#fff0b3;border-radius:8px;padding:2px 8px;font-family:Consolas,monospace;font-size:18px}
pre.code{background:#0f2e24;color:#fff0b3;border-radius:12px;padding:12px;overflow-x:auto;font-size:19px;font-family:Consolas,monospace;margin:8px 0;min-height:48px}
table.t{border-collapse:collapse;width:100%;font-size:19px;margin:10px 0}
.t th{background:#0b7a5a;color:#fff;padding:9px;text-align:left}.t td{padding:8px 9px;border-bottom:2px solid #d6efe4}
.arr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.bx{min-width:64px;text-align:center}.bx b{display:block;background:#0b7a5a;color:#fff;border-radius:12px;padding:10px 6px;font-size:24px}.bx.k b{cursor:pointer}.bx.k b:hover{background:#f2b705;color:#0e3a2c}
.bx i{display:block;font-style:normal;color:#0b7a5a;font-weight:bold;font-size:14px;margin-top:3px;min-height:18px}
.nm{background:#fff;border:3px solid #0b7a5a;color:#0b7a5a;border-radius:30px;padding:8px 18px;font-size:19px;font-weight:bold;cursor:pointer;margin:4px;font-family:Consolas,monospace}.nm:disabled{opacity:.35;cursor:default}
.ok{color:#0b7a4f;font-weight:bold}.no{color:#c8431e;font-weight:bold}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.right{background:#0b7a4f}.opt.wrong{background:#c8431e}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.hero{text-align:center;padding:24px 10px}.hero .ci{display:inline-block;border-radius:22px;overflow:hidden;box-shadow:0 8px 20px #0005;max-width:100%}
.mem{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cardm{height:96px;border:0;border-radius:14px;background:#0b7a5a;color:#fff;font-size:30px;cursor:pointer;font-family:inherit;padding:6px}
.cardm.f{background:#fff;color:#0e3a2c;border:3px solid #0b7a5a;font-size:16px;font-weight:bold}.cardm.m{background:#dff5ea;border-color:#0b7a4f;color:#0b7a4f}
.prog{font-weight:bold;color:#0b7a5a}
.ex{background:#fff0b3;border-radius:16px;padding:16px;font-size:22px;font-weight:bold;text-align:center;margin:10px 0}
</style></head><body>
<div class="logo"><b>Young</b> <i>IT</i> <u>Germany</u></div>
<main id="app"></main>
<script>
const SALES=[12,18,15,22,9,25,19];
const G=[['🔎','Index Hunt',5],['🃏','Memory Match',5],['🔮','Predict the Array',4],['🧱','Code Builder',5],['🐞','Bug Hunter',4]];
let me={name:'',cls:''},S={},V={};
const $=id=>document.getElementById(id),app=$('app');
const sc=i=>Object.values(S[i]||{}).reduce((x,y)=>x+y,0);
const setS=(i,k,v)=>{S[i]=S[i]||{};S[i][k]=Math.max(S[i][k]||0,v)};
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const say=(c,t)=>`<div class="say"><div class="c">${c}</div><div>${t}</div></div>`;
const tip=l=>`<details class="tips" open><summary>💡 Tips to help you</summary><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></details>`;
const GEM=`<svg viewBox="0 0 300 160" width="420" style="max-width:100%;display:block"><rect width="300" height="160" fill="#fff3cf"/><path d="M0 130Q70 100 140 128T300 118V160H0Z" fill="#0b7a5a"/><path d="M0 146Q90 126 170 146T300 140V160H0Z" fill="#075c44"/><polygon points="215,40 245,40 262,60 230,98 198,60" fill="#18b07f"/><polygon points="198,60 262,60 230,98" fill="#0b7a5a"/><polygon points="215,40 230,60 245,40" fill="#6fe0b8"/><path d="M270 30l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#f2b705"/><ellipse cx="100" cy="112" rx="42" ry="30" fill="#3fbf6a"/><circle cx="80" cy="76" r="17" fill="#3fbf6a"/><circle cx="120" cy="76" r="17" fill="#3fbf6a"/><circle cx="80" cy="76" r="11" fill="#fff"/><circle cx="120" cy="76" r="11" fill="#fff"/><circle cx="82" cy="77" r="5" fill="#0e3a2c"/><circle cx="118" cy="77" r="5" fill="#0e3a2c"/><path d="M82 112q18 14 36 0" stroke="#0e3a2c" stroke-width="3" fill="none" stroke-linecap="round"/><text x="22" y="40" font-size="22" font-weight="bold" fill="#0b7a5a" font-family="Arial">12</text><text x="150" y="30" font-size="26" font-weight="bold" fill="#c8431e" font-family="Arial">25</text><text x="168" y="86" font-size="20" font-weight="bold" fill="#f2b705" font-family="Arial">7</text></svg>`;
const boxes=(a,o={})=>`<div class="arr">${a.map((v,i)=>`<div class="bx ${o.click?'k':''}"><b ${o.click?`onclick="${o.click}(${i})"`:''}>${v}</b><i>${o.lab?o.lab(i):''}</i></div>`).join('')}</div>`;
function mk(i,tips){V[i]=1;app.innerHTML=`<span class="pill">🎮 Game ${i+1} of 5</span><div class="ban"><h2>${G[i][0]} ${G[i][1]}</h2></div><div class="card"><div id="gm"></div>${tip(tips)}</div><div class="nav"><button class="b w" onclick="home()">⬅ Menu</button>${i<4?`<button class="b" onclick="go(${i+1})">Next Game ➡</button>`:`<button class="b o" onclick="results()">See My Results 🏆</button>`}</div>`;window.scrollTo(0,0)}
const go=i=>[g1,g2,g3,g4,g5][i]();
const nx=f=>`<button class="b o" onclick="${f}">Next ➡</button>`;
const fin=()=>say('🐸','🎉 Well done! You finished this game. Try another one from the menu!');

function splash(){app.innerHTML=`<div class="hero"><div class="ci">${GEM}</div><div class="ban" style="margin-top:20px"><h1>NumPy Mini Games</h1><div class="sub">Working with numbers and data</div></div><button class="b o" onclick="reg()">Begin 🚀</button></div>`}
function reg(){app.innerHTML=`<div class="card" style="text-align:center">${say('🐸','Hello, Number Explorer! Tell me your name and class to start playing.')}<p><input type="text" id="nm" placeholder="Your name" maxlength="40"></p><p><input type="text" id="cl" placeholder="Your class (e.g. Class 6)" maxlength="20"></p><p id="er" class="no"></p><button class="b" onclick="enter()">Enter Games 🎮</button></div>`}
function enter(){const n=$('nm').value.trim(),c=$('cl').value.trim();if(!n||!c){$('er').textContent='Please type your name and class first 🙂';return}me={name:n,cls:c};home()}
function home(){app.innerHTML=`<div class="ban"><h1 style="font-size:32px">Hi ${esc(me.name)}! 🐸</h1><div class="sub">Pick any game. No timer, just fun!</div></div><div class="menu">${G.map((g,i)=>`<button class="mc ${V[i]?'v':''}" onclick="go(${i})"><span class="e">${g[0]}</span><b>${g[1]}</b><small>${'⭐'.repeat(sc(i))}${'☆'.repeat(g[2]-sc(i))}</small></button>`).join('')}<button class="mc" onclick="results()" style="border-color:#f2b705"><span class="e">🏅</span><b>My Results</b><small>See &amp; download</small></button></div>`}

/* 1 Index Hunt */
const IH=[['Tap the box that is <code>sales[3]</code>',3],['Tap the box that is <code>sales[0]</code>',0],['Tap the box that is <code>sales[6]</code>',6],['Tap the box that is <code>sales[2]</code>',2],['Which box holds the number <b>25</b>?',5]];let r1=0;
function g1(){r1=0;mk(0,['Counting starts at <b>0</b>, not 1!','The boxes have no labels. Count: 0, 1, 2, 3...','The last box of 7 numbers is index 6.']);d1()}
function d1(){if(r1>=5){$('gm').innerHTML=fin();return}$('gm').innerHTML=`<p class="prog">Round ${r1+1} of 5</p><pre class="code">sales = np.array([12, 18, 15, 22, 9, 25, 19])</pre><p>${IH[r1][0]}</p>${boxes(SALES,{click:'a1',lab:()=>'&nbsp;'})}<div id="fb"></div>`}
function a1(i){if(i===IH[r1][1]){setS(0,'r'+r1,1);$('fb').innerHTML='<p class="ok">✅ Yes!</p>'+nx('r1++;d1()')}else $('fb').innerHTML='<p class="no">❌ Not that box. Count from 0!</p>'}

/* 2 Memory Match */
const P=[['np.sum(sales)','Adds all the numbers'],['np.max(sales)','Finds the biggest number'],['np.min(sales)','Finds the smallest number'],['np.mean(sales)','Finds the average'],['sales * 2','Doubles every number']];let cs=[],op=[],lock=false;
function g2(){const a=[];P.forEach((p,i)=>{a.push({i,t:p[0],c:1,m:0},{i,t:p[1],c:0,m:0})});cs=a.sort(()=>Math.random()-.5);op=[];lock=false;mk(1,['Flip two cards. Match the <b>code</b> with what it <b>does</b>.','If they do not match, they flip back. Remember where they are!','<b>max</b> = biggest, <b>min</b> = smallest, <b>mean</b> = average.']);d2()}
function d2(){const dn=cs.every(c=>c.m);$('gm').innerHTML=`<p class="prog">Matched: ${cs.filter(c=>c.m).length/2} of 5</p><div class="mem">${cs.map((c,k)=>`<button class="cardm ${c.m?'f m':op.includes(k)?'f':''}" onclick="fl(${k})">${c.m||op.includes(k)?(c.c?'<code>'+esc(c.t)+'</code>':esc(c.t)):'🐸'}</button>`).join('')}</div>${dn?fin():''}`}
function fl(k){if(lock||cs[k].m||op.includes(k))return;op.push(k);d2();if(op.length===2){const[a,b]=op;if(cs[a].i===cs[b].i){cs[a].m=cs[b].m=1;setS(1,'p'+cs[a].i,1);op=[];setTimeout(d2,400)}else{lock=true;setTimeout(()=>{op=[];lock=false;d2()},1100)}}}

/* 3 Predict the Array */
const PR=[['arr = np.array([2, 4, 6])','arr * 2',['[4 8 12]','[2 4 12]','[4 6 8]'],0,'× 2 doubles EVERY number.'],['arr = np.array([10, 20, 30])','arr + 5',['[10 20 35]','[15 25 35]','[5 5 5]'],1,'+ 5 adds 5 to EVERY number.'],['arr = np.array([1, 2, 3])','arr * 10',['[10 20 30]','[11 12 13]','[1 2 30]'],0,'× 10 makes every number 10 times bigger.'],['arr = np.array([5, 10, 15])','arr - 1',['[4 10 15]','[5 9 14]','[4 9 14]'],2,'− 1 takes 1 away from EVERY number.']];let r3=0;
function g3(){r3=0;mk(2,['NumPy does the maths on <b>all</b> numbers at once.','Work out the first number, then check the others.','Look at every number in the answer before you pick!']);d3()}
function d3(){if(r3>=PR.length){$('gm').innerHTML=fin();return}const p=PR[r3];$('gm').innerHTML=`<p class="prog">Round ${r3+1} of 4</p><pre class="code">${esc(p[0])}\nprint(${esc(p[1])})</pre><p>What will the computer show?</p>${p[2].map((o,j)=>`<button class="b opt" onclick="a3(${j},this)"><code>${esc(o)}</code></button>`).join('')}<div id="fb"></div>`}
function a3(j,el){const p=PR[r3];if(j===p[3]){el.classList.add('right');setS(2,'p'+r3,1);$('fb').innerHTML=`<p class="ok">✅ ${p[4]}</p>`+nx('r3++;d3()')}else{el.classList.add('wrong');$('fb').innerHTML='<p class="no">❌ Not that one. Try each number!</p>'}}

/* 4 Code Builder */
const K=[['Find the biggest number',['np','.max','(sales)']],['Find the average',['np','.mean','(sales)']],['Show the first number',['sales','[0]']],['Double every number',['sales','*','2']],['Keep numbers bigger than 15',['sales','[','sales','>','15',']']]];let r4=0,tk=[],bt=[];
function g4(){r4=0;mk(3,['Tap the pieces in the right order to build the code line.','Start with <code>np</code> for the maths functions, or with <code>sales</code> for the array.','Made a mistake? Use Undo or Clear.']);d4()}
function d4(){if(r4>=K.length){$('gm').innerHTML=fin();return}tk=K[r4][1].map((t,i)=>({t,i})).sort(()=>Math.random()-.5);bt=[];dr4()}
function dr4(){const k=K[r4];$('gm').innerHTML=`<p class="prog">Build ${r4+1} of 5</p><p><b>Goal:</b> ${k[0]}</p><pre class="code">${esc(bt.map(i=>tk.find(x=>x.i===i).t).join(''))}</pre>${tk.map(x=>`<button class="nm" ${bt.includes(x.i)?'disabled':''} onclick="pk(${x.i})">${esc(x.t)}</button>`).join('')}<br><button class="b w" onclick="bt.pop();dr4()">↩ Undo</button><button class="b w" onclick="bt=[];dr4()">Clear</button><div id="fb"></div>`}
function pk(i){bt.push(i);dr4();if(bt.length===tk.length){const s=bt.map(j=>tk.find(x=>x.i===j).t).join(''),ok=s===K[r4][1].join('');if(ok){setS(3,'k'+r4,1);$('fb').innerHTML='<p class="ok">✅ Perfect code!</p>'+nx('r4++;d4()')}else $('fb').innerHTML='<p class="no">❌ Not quite. Press Clear and try again.</p>'}}

/* 5 Bug Hunter */
const B=[['np.sum(Sales)',['sales needs a small s','np needs a capital N','sum is the wrong word'],0,'Python cares about capital letters: Sales is not sales.'],['sales[1]   # goal: the FIRST number',['The 1 should be a 2','The first index is 0, not 1','Square brackets are wrong'],1,'Counting starts at 0, so the first number is sales[0].'],['np.mean[sales]',['mean needs round brackets ( )','sales needs quotes','np should be NumPy'],0,'Actions like mean() use round brackets to run.'],['np.array(12, 18, 15)',['Numbers need to be bigger','The numbers go inside square brackets [ ]','Remove np'],1,'Write np.array([12, 18, 15]) with [ ] around the numbers.']];let r5=0;
function g5(){r5=0;mk(4,['Read the code slowly, one piece at a time.','Check: capital letters, index numbers, and brackets.','Round brackets ( ) run actions. Square brackets [ ] hold lists or pick positions.']);d5()}
function d5(){if(r5>=B.length){$('gm').innerHTML=fin();return}const b=B[r5];$('gm').innerHTML=`<p class="prog">Bug ${r5+1} of 4</p><p>This code has a mistake. Find it!</p><pre class="code">${esc(b[0])}</pre>${b[1].map((o,j)=>`<button class="b opt" onclick="a5(${j},this)">${esc(o)}</button>`).join('')}<div id="fb"></div>`}
function a5(j,el){const b=B[r5];if(j===b[2]){el.classList.add('right');setS(4,'b'+r5,1);$('fb').innerHTML=`<p class="ok">✅ ${b[3]}</p>`+nx('r5++;d5()')}else{el.classList.add('wrong');$('fb').innerHTML='<p class="no">❌ Not that one. Look again!</p>'}}

function results(){const tot=G.reduce((s,_,i)=>s+sc(i),0),mx=G.reduce((s,g)=>s+g[2],0);
 app.innerHTML=`<div class="ban"><h1>🏅 My Results</h1></div><div class="card"><p><b>Name:</b> ${esc(me.name)} &nbsp; <b>Class:</b> ${esc(me.cls)}</p><table class="t"><tr><th>Game</th><th>Points</th><th>Stars</th></tr>${G.map((g,i)=>`<tr><td>${g[0]} ${g[1]}</td><td>${sc(i)} / ${g[2]}</td><td>${'⭐'.repeat(sc(i))}${'☆'.repeat(g[2]-sc(i))}</td></tr>`).join('')}<tr><th>Total</th><th colspan="2">${tot} / ${mx}</th></tr></table>
${say('🐸',tot>=mx*.8?'Fantastic! You are a real Number Explorer! 🎉':'Great effort! Play more games to earn more stars ⭐')}<button class="b o" onclick="dl()">📥 Download my result (PDF)</button></div><button class="b w" onclick="home()">⬅ Back to Menu</button>`}
function dl(){const tot=G.reduce((s,_,i)=>s+sc(i),0),mx=G.reduce((s,g)=>s+g[2],0);
 const L=[['Young IT Germany',12],['NumPy Mini Games',22],['',8],['Name: '+me.name,16],['Class: '+me.cls,16],['Date: '+new Date().toLocaleDateString(),12],['',8],...G.map((g,i)=>[g[1]+':  '+sc(i)+' / '+g[2],15]),['',8],['Total points: '+tot+' / '+mx,20],['',8],['Great work, Number Explorer!',14]];
 let y=790,c='BT\n';L.forEach(l=>{c+=`/F1 ${l[1]} Tf 1 0 0 1 50 ${y} Tm (${l[0].replace(/[^\x20-\x7e]/g,'?').replace(/([\\()])/g,'\\$1')}) Tj\n`;y-=l[1]+14});c+='ET';
 const O=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>','<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>',`<</Length ${c.length}>>\nstream\n${c}\nendstream`,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>'];
 let p='%PDF-1.4\n',off=[];O.forEach((o,i)=>{off.push(p.length);p+=`${i+1} 0 obj\n${o}\nendobj\n`});const x=p.length;
 p+=`xref\n0 ${O.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${O.length+1}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([p],{type:'application/pdf'}));a.download='numpy-games-'+me.name.replace(/\W+/g,'_')+'.pdf';document.body.appendChild(a);a.click();a.remove()}
splash();
</script></body></html>
